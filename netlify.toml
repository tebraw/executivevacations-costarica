[build]
  # Build Command
  command = "npm install && cd netlify/functions && npm install && cd ../.. && npm run build"
  
  # Publish Directory (the built output)
  publish = "dist"

# Functions Directory
[functions]
  directory = "netlify/functions"

# Edge Functions Directory
[edge_functions]
  directory = "netlify/edge-functions"

[[edge_functions]]
  path = "/blog/*"
  function = "blog-og"

# Scheduled function — daily follow-up emails/SMS at 10:00 AM UTC
[functions."follow-up"]
  schedule = "0 10 * * *"

# Redirects are now in public/_redirects file

# Headers for better performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/*.jsx"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
