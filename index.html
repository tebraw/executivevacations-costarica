<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="preload" as="image" href="/images/hero-bg.webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
    <title>Private Luxury Villas in Costa Rica — Beachfront, Pool &amp; Concierge | Executive Vacations</title>
    <meta name="description" content="Discover 4 exclusive luxury villas in Costa Rica. Beachfront estates with private pools, stunning ocean views, and personalized concierge service." />
    <meta property="og:site_name" content="Executive Vacations" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Executive Vacations",
      "url": "https://executivevacations.net",
      "logo": "https://executivevacations.net/favicon.png",
      "sameAs": ["https://executivevacations.net"]
    }
    </script>
    <script type="text/javascript">
        // GitHub Pages SPA support
        (function(l) {
            if (l.search[1] === '/' ) {
                var decoded = l.search.slice(1).split('&').map(function(s) { 
                    return s.replace(/~and~/g, '&')
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location))
    </script>
  </head>
  <body>
    <!-- Hidden form for Netlify Forms detection -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="date" name="travelDate" />
      <input type="number" name="numberOfPeople" />
      <textarea name="message"></textarea>
      <input type="text" name="villa-selected" />
      <input type="text" name="activities-selected" />
    </form>

    <!-- Hidden form for villa detail page inquiries -->
    <form name="villa-inquiry" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="date" name="checkIn" />
      <input type="date" name="checkOut" />
      <input type="number" name="numberOfPeople" />
      <textarea name="message"></textarea>
      <input type="text" name="villa-selected" />
    </form>

    <!-- Hidden form for pricing guide lead capture -->
    <form name="pricing-lead" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="villaInterest" />
      <input type="text" name="welcomeMessage" />
    </form>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
